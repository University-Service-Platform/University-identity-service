name: CI

on:
  push:
    branches: [main, "feature-**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Render runs the service on Postgres; run the whole suite (incl. migrations) there too
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/identity_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, test-postgres]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t university-identity-service:ci .

      - name: Start container and check health
        run: |
          docker run -d --name identity -p 8001:8001 \
            -e SEED_DEMO_DATA=true -e DEMO_USER_PASSWORD=ci-demo-password \
            university-identity-service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8001/health
          curl -fsS http://localhost:8001/.well-known/jwks.json > /dev/null
          curl -fsS -X POST http://localhost:8001/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username": "STU001", "password": "ci-demo-password"}' > /dev/null

      - name: Show container logs
        if: always()
        run: docker logs identity || true
