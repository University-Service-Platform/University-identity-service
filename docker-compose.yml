# Standalone Identity Service. The platform-wide compose file (all teams + API Gateway)
# is owned by the Project Integration Council; reuse the service definition below there.
#
#   DEMO_USER_PASSWORD=<choose-one> docker compose up --build
#
# Swagger UI: http://localhost:8001/docs
services:
  identity-service:
    build: .
    image: university-identity-service:local
    ports:
      - "${IDENTITY_SERVICE_PORT:-8001}:8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: sqlite:////data/identity.db
      # RS256 keys: leave empty in development for an ephemeral key pair, or mount
      # keys generated by scripts/generate_jwt_keys.py and point these paths at them.
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      JWT_ISSUER: ${JWT_ISSUER:-university-identity-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-university-services-platform}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Directory Service (runs separately; host.docker.internal reaches the host machine)
      DIRECTORY_SERVICE_BASE_URL: ${DIRECTORY_SERVICE_BASE_URL:-http://host.docker.internal:8002}
      DIRECTORY_SERVICE_TIMEOUT_SECONDS: ${DIRECTORY_SERVICE_TIMEOUT_SECONDS:-3}
      # Synthetic demo users (see app/seed.py)
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - identity-data:/data
    restart: unless-stopped

volumes:
  identity-data:
